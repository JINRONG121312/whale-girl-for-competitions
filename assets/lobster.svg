<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120" role="img" aria-label="龙虾娘老板">
  <defs>
    <linearGradient id="lbBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9d7a"/>
      <stop offset="100%" stop-color="#df5237"/>
    </linearGradient>
  </defs>

  <!-- 触须 -->
  <path d="M43 30C35 18 27 16 21 8" fill="none" stroke="#d94b2e" stroke-width="3" stroke-linecap="round"/>
  <path d="M57 30C65 18 73 16 79 8" fill="none" stroke="#d94b2e" stroke-width="3" stroke-linecap="round"/>

  <!-- 蟹钳 -->
  <g fill="url(#lbBody)">
    <ellipse cx="19" cy="60" rx="11.5" ry="8.2" transform="rotate(-16 19 60)"/>
    <ellipse cx="81" cy="60" rx="11.5" ry="8.2" transform="rotate(16 81 60)"/>
  </g>
  <path d="M9 57c4.5 2.6 9 2.6 13.5 0" fill="none" stroke="#b83c22" stroke-width="2" stroke-linecap="round"/>
  <path d="M91 57c-4.5 2.6-9 2.6-13.5 0" fill="none" stroke="#b83c22" stroke-width="2" stroke-linecap="round"/>

  <!-- 尾巴 -->
  <ellipse cx="50" cy="88" rx="16" ry="6" fill="#f08363"/>
  <ellipse cx="50" cy="95" rx="10.5" ry="4.6" fill="#e56b4c"/>

  <!-- 小腿 -->
  <g stroke="#d94b2e" stroke-width="3" stroke-linecap="round">
    <path d="M33 67l-8 6"/>
    <path d="M31 75l-7 5"/>
    <path d="M67 67l8 6"/>
    <path d="M69 75l7 5"/>
  </g>

  <!-- 身体 -->
  <ellipse cx="50" cy="61" rx="21" ry="19" fill="url(#lbBody)"/>
  <!-- 头 -->
  <ellipse cx="50" cy="37" rx="16" ry="13" fill="url(#lbBody)"/>

  <!-- 眼睛 -->
  <circle cx="43" cy="36" r="4.7" fill="#2b1a17"/>
  <circle cx="57" cy="36" r="4.7" fill="#2b1a17"/>
  <circle cx="44.3" cy="34.4" r="1.6" fill="#ffffff"/>
  <circle cx="58.3" cy="34.4" r="1.6" fill="#ffffff"/>

  <!-- 腮红 -->
  <ellipse cx="35.5" cy="43" rx="4" ry="2.4" fill="#ffb3a7" opacity="0.9"/>
  <ellipse cx="64.5" cy="43" rx="4" ry="2.4" fill="#ffb3a7" opacity="0.9"/>

  <!-- 嘴 -->
  <path d="M46 45c1.8 2.2 6.4 2.2 8 0" fill="none" stroke="#7a2b1c" stroke-width="2" stroke-linecap="round"/>

  <!-- 蝴蝶结 -->
  <path d="M44.5 23.5l-6.5-4.2v8.4z" fill="#ffd166"/>
  <path d="M55.5 23.5l6.5-4.2v8.4z" fill="#ffd166"/>
  <circle cx="50" cy="23.5" r="2.6" fill="#f0a500"/>
</svg>
